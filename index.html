<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>تمريني — متتبع التمارين</title>
<style>
:root{
  --ink:#0B1220;--muted:#5B6679;--line:#E3E8F1;--bg:#FFFFFF;--card:#F4F7FC;
  --surface:#FFFFFF;--deep:#0B1220;--bd-blue:#CFE0FC;--bd-pink:#F4D6CE;--bd-green:#C7E8D5;--ok-t:#157A52;--amb-l:#FFF6E0;--amb-bd:#F4DFA8;--amb-t:#9A6A00;--ring:#D5DCE8;--ph:#A7B1C2;--blue:#1F6FEB;--blue-d:#1457C2;--blue-l:#E6EFFE;
  --green:#1FA971;--green-l:#E1F4EA;--pink-l:#FCEAE5;--pink:#B5482A;--amber:#E59B00;--red:#D64545;
  --r:20px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Noto Sans Arabic","Noto Kufi Arabic",Tahoma,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5}
body{padding-top:var(--safe-t)}
#app{max-width:480px;margin:0 auto;padding:14px 16px calc(96px + var(--safe-b))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--blue);text-decoration:none}
h1{font-size:30px;line-height:1.2;font-weight:800;margin:6px 0 4px;letter-spacing:-.3px}
h1 b{color:var(--blue);font-weight:800}
h2{font-size:20px;font-weight:800;margin:0 0 8px}
.sub{color:var(--muted);font-size:15px;margin:0 0 14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.blue{background:var(--blue-l);border-color:var(--bd-blue)}
.card.pink{background:var(--pink-l);border-color:var(--bd-pink)}
.card.green{background:var(--green-l);border-color:var(--bd-green)}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.3px;color:var(--blue);background:var(--blue-l);border-radius:999px;padding:2px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;font-weight:800;border-radius:14px;padding:13px 20px;min-height:48px}
.btn:active{background:var(--blue-d)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--surface);color:var(--blue);border:1.5px solid var(--bd-blue)}
.btn.dark{background:var(--ink)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.ring{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ring);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted);background:var(--surface)}
.ring.sched{border-color:#9DB8F0;color:var(--blue)}
.ring.today{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.ring.done{border-color:var(--green);background:var(--green);color:#fff}
.ring.part{border-color:var(--amber);color:var(--amber)}

/* list items */
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0;text-align:right;width:100%}
.item .badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--blue-l);color:var(--blue);font-weight:800;font-size:18px;flex:none}
.item.done .badge{background:var(--green-l);color:var(--green)}
.item .t{font-weight:800}
.item .s{color:var(--muted);font-size:13px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .25s}

/* workout */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ss-title{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.5px;margin:18px 4px 4px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:8px 0;box-shadow:0 1px 0 rgba(11,18,32,.03)}
.ex.complete{border-color:#B8E3CB;background:var(--green-l)}
.ex h3{margin:0;font-size:17px;line-height:1.3;font-weight:800}
.ex .en{color:var(--muted);font-size:12.5px;direction:ltr;text-align:right}
.ex .note{color:var(--muted);font-size:13.5px;margin:8px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--card);border:1px solid var(--line)}
.chip.blue{background:var(--blue-l);border-color:var(--bd-blue);color:var(--blue-d)}
.chip.green{background:var(--green-l);border-color:var(--bd-green);color:var(--ok-t)}
.nownext{background:var(--blue-l);border-radius:14px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.nownext b{color:var(--blue-d)}
.sets{margin-top:8px}
.setrow,.sethead{display:grid;grid-template-columns:26px 1fr 1fr 58px 46px;gap:8px;align-items:center}
.sethead{font-size:11.5px;color:var(--muted);font-weight:700;text-align:center;margin-bottom:4px}
.setrow{margin:6px 0}
.setrow .n{font-weight:800;color:var(--muted);text-align:center}
.inp{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);text-align:center;font-weight:800;font-size:17px;direction:ltr;min-width:0}
.inp:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.inp::placeholder{color:var(--ph);font-weight:600}
.setrow.done .inp{background:var(--green-l);border-color:var(--bd-green)}
.eff{height:46px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--muted)}
.eff.on{color:var(--ink);background:var(--surface)}
.chk{height:46px;border-radius:12px;background:var(--surface);border:2px solid var(--ring);display:grid;place-items:center;color:#fff}
.chk svg{opacity:0}
.setrow.done .chk{background:var(--green);border-color:var(--green)}
.setrow.done .chk svg{opacity:1}
.exbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.notebox{width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;font-size:14px;min-height:40px;resize:vertical}

/* rest timer */
#rest{position:fixed;left:0;right:0;bottom:calc(66px + var(--safe-b));max-width:480px;margin:0 auto;padding:0 12px;z-index:20;display:none}
#rest.on{display:block}
#rest .box{background:var(--deep);color:#fff;border-radius:20px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(11,18,32,.25)}
#rest .tm{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;min-width:70px}
#rest .lb{font-size:12.5px;color:#B5C2DA}
#rest button{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
#rest svg{width:44px;height:44px;transform:rotate(-90deg)}

/* nav */
nav.bar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.bar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.bar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11.5px;font-weight:700;color:var(--muted)}
nav.bar button.on{color:var(--blue)}

/* sheets / overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(11,18,32,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + var(--safe-b));max-height:88vh;overflow:auto}
.recap{position:fixed;inset:0;z-index:60;background:var(--deep);color:#fff;overflow:auto;padding:calc(20px + var(--safe-t)) 18px 30px}
.recap .in{max-width:480px;margin:0 auto}
.recap h1{color:#fff}
.recap .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.recap .stat{background:#16203A;border-radius:18px;padding:14px}
.recap .stat b{display:block;font-size:26px;font-weight:800}
.recap .stat span{color:#9FB0CE;font-size:13px}
.recap .pr{background:#16203A;border:1px solid #2A3A63;border-radius:16px;padding:10px 14px;margin:8px 0;display:flex;gap:10px;align-items:center}
.recap .btn{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + var(--safe-b));background:var(--deep);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:90;max-width:90%;text-align:center}

/* progress */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.tile b{display:block;font-size:26px;font-weight:800}
.tile span{color:var(--muted);font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{color:var(--muted);font-size:12px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t td.l{direction:ltr;text-align:right}
select.sel,.field{width:100%;height:48px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:0 12px;font-weight:700}
.field{display:block}
.field.num{direction:ltr;text-align:center}
.wkgrid{display:grid;grid-template-columns:54px repeat(4,1fr);gap:6px;align-items:center}
.cell{height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.cell.done{background:var(--green-l);border-color:var(--bd-green);color:var(--ok-t)}
.cell.part{background:var(--amb-l);border-color:var(--amb-bd);color:var(--amb-t)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:18px}
.stepper b{min-width:24px;text-align:center}
.banner{display:flex;gap:10px;align-items:center;background:var(--amb-l);border:1px solid var(--amb-bd);border-radius:16px;padding:10px 12px;font-size:14px;margin:10px 0}
.plate{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:12px;background:var(--deep);color:#fff;font-weight:800;margin:3px;padding:0 8px;font-size:15px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:8px 0}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pill-warn{color:var(--pink);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body.resting #app{padding-bottom:calc(190px + var(--safe-b))}
.witem{background:var(--surface);border:1px solid var(--line,#E3E8F1);border-radius:14px;padding:10px 12px;margin:8px 0}
.witem.done{opacity:.7;background:var(--green-l)}
.witem .row{gap:10px;align-items:center}
.witem .chk{flex:none}

html[data-theme=dark]{--ink:#E8EDF7;--muted:#9AA7BF;--line:#26324A;--bg:#0A1020;--card:#121B2E;--surface:#17223A;--deep:#1E2B49;
 --blue:#5B9BFF;--blue-d:#3F82EE;--blue-l:#14284D;--green:#2FC287;--green-l:#0F2E21;--pink-l:#33201B;--pink:#F08C6B;--amber:#F0B429;--red:#FF7A7A;
 --bd-blue:#25427A;--bd-pink:#52302A;--bd-green:#1E5139;--ok-t:#5BE3A3;--amb-l:#33290D;--amb-bd:#5A4713;--amb-t:#F0C95B;--ring:#33415E;--ph:#5E6B84;color-scheme:dark}
html[data-theme=dark] .btn{color:#06101F}
html[data-theme=dark] .btn.ghost{color:var(--blue)}
html[data-theme=dark] .ring.done,html[data-theme=dark] .chk.on{color:#06101F}
html[data-theme=dark] nav.bar{background:rgba(10,16,32,.92)}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}.mrow span{width:92px}.mrow b{width:42px;text-align:left;direction:ltr}
.mbar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}.mbar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.streak{font-weight:800;color:var(--amber);font-size:14px}
.citem{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;border-top:1px solid var(--line);margin-top:6px}.citem:first-of-type{margin-top:10px}
.cdot{width:26px;height:26px;border-radius:50%;border:2px solid var(--ring);display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;flex:none}
.citem.done .cdot{background:var(--green);border-color:var(--green)}.citem.done .sp{color:var(--muted);text-decoration:line-through}
.dots{direction:rtl;display:flex;gap:6px;justify-content:center;margin:12px 0}.dot{width:8px;height:8px;border-radius:50%;background:var(--ring)}.dot.on{background:var(--blue);width:22px;border-radius:99px}.dot.ok{background:var(--green)}
.rep{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.rep b{display:block;font-size:20px}.rep span{font-size:12px;color:var(--muted)}

.restctl{display:inline-flex;align-items:center;border:1.5px solid var(--bd-blue);border-radius:12px;overflow:hidden;background:var(--surface)}
.restctl button{height:36px;min-width:36px;padding:0 10px;font-weight:800;color:var(--blue)}
.restctl .go{border-inline:1px solid var(--bd-blue);font-size:14px}

nav.bar .in{grid-template-columns:repeat(5,1fr)}
.seg.wrap{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg.wrap button{padding:8px 4px;line-height:1.3}
select.field{appearance:none}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.banner.gold{background:var(--amber-l,#fff3d6);color:var(--amber,#8a5a00)}

</style>
</head>

<script>
/* Pure logic for the workout app. No DOM. Works in browser (window.BWSLogic) and node (module.exports). */
(function (root) {
  'use strict';

  // "٢٫٥" / "2,5" / " 7.5 " -> 2.5 / 2.5 / 7.5 ; invalid/empty -> null
  function parseNum(s) {
    if (s === null || s === undefined) return null;
    if (typeof s === 'number') return isFinite(s) ? s : null;
    let t = String(s).trim();
    if (!t) return null;
    t = t.replace(/[٠-٩]/g, c => String(c.charCodeAt(0) - 0x0660))
         .replace(/[۰-۹]/g, c => String(c.charCodeAt(0) - 0x06F0))
         .replace(/[٫,]/g, '.');
    if (!/^\d*\.?\d+$|^\d+\.$/.test(t)) return null;
    const n = parseFloat(t);
    return isFinite(n) && n >= 0 ? n : null;
  }

  const DAY = 86400000;
  function toDay(iso) { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY; }
  // Week number (1-based) of dateISO counted from startISO.
  function weekOf(startISO, dateISO) {
    return Math.max(1, Math.floor((toDay(dateISO) - toDay(startISO)) / 7) + 1);
  }
  function todayISO(d) {
    d = d || new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function addDays(iso, n) {
    const t = new Date((toDay(iso) + n) * DAY);
    return t.getUTCFullYear() + '-' + String(t.getUTCMonth() + 1).padStart(2, '0') + '-' + String(t.getUTCDate()).padStart(2, '0');
  }

  // Plate loading. plates = {"10":4,"5":4,...} counts of plates owned (pairs go on two sides).
  // mode 'bar': one bar uses plates/2 per side. mode 'db': a PAIR of dumbbells shares the pool -> plates/4 per side each.
  // Returns {ok, perSide:[{kg,n}], achieved, remainder}; remainder>0 means target not reachable (achieved is the closest below).
  function platesFor(total, handleKg, plates, mode) {
    const sizes = Object.keys(plates).map(Number).filter(k => plates[k] > 0).sort((a, b) => b - a);
    const div = mode === 'db' ? 4 : 2;
    const avail = sizes.map(k => Math.floor(plates[k] / div));
    const target = Math.round((total - handleKg) * 1000) / 2000; // per side, kg
    if (target < -1e-9) return { ok: false, below: true, perSide: [], achieved: handleKg, remainder: total - handleKg };
    let best = null;
    const pick = new Array(sizes.length).fill(0);
    (function rec(i, sum, cnt) {
      if (sum > target + 1e-9) return;
      if (i === sizes.length) {
        const diff = target - sum;
        if (!best || diff < best.diff - 1e-9 || (Math.abs(diff - best.diff) < 1e-9 && cnt < best.cnt)) {
          best = { diff, cnt, pick: pick.slice() };
        }
        return;
      }
      for (let n = 0; n <= avail[i]; n++) { pick[i] = n; rec(i + 1, sum + n * sizes[i], cnt + n); }
      pick[i] = 0;
    })(0, 0, 0);
    const perSide = sizes.map((k, i) => ({ kg: k, n: best.pick[i] })).filter(x => x.n > 0);
    const sideSum = perSide.reduce((a, x) => a + x.kg * x.n, 0);
    const achieved = Math.round((handleKg + 2 * sideSum) * 1000) / 1000;
    const remainder = Math.round((total - achieved) * 1000) / 1000;
    return { ok: Math.abs(remainder) < 1e-6, perSide, achieved, remainder };
  }

  const e1rm = (w, r) => w * (1 + r / 30);

  // Sessions: {id, week, date, wk, done, sets:{slotKey:{name,kind,sets:[{w,r,e,done}]}}}
  function doneSets(slot) { return (slot.sets || []).filter(s => s.done && (s.r > 0 || s.w > 0)); }

  function topSet(sets, kind) {
    let best = null;
    for (const s of sets) {
      // weight: estimated 1RM; wopt (weight optional, e.g. abs): weight first then reps; others: reps
      const score = kind === 'weight' ? e1rm(s.w || 0, s.r || 0) : kind === 'wopt' ? (s.w || 0) * 1000 + (s.r || 0) : (s.r || 0);
      if (!best || score > best.score) best = { w: s.w || 0, r: s.r || 0, e: s.e, score };
    }
    return best;
  }

  // History of one performed exercise (by English name) across finished or in-progress sessions, ordered by week.
  function historyFor(sessions, name) {
    const out = [];
    Object.values(sessions).forEach(se => {
      Object.values(se.sets || {}).forEach(slot => {
        if (slot.name !== name) return;
        const ds = doneSets(slot);
        if (!ds.length) return;
        const kind = slot.kind || 'weight';
        out.push({
          sessionId: se.id, week: se.week, date: se.date, wk: se.wk, kind, sets: ds,
          top: topSet(ds, kind),
          volume: ds.reduce((a, s) => a + (s.w || 0) * (s.r || 0), 0),
          reps: ds.reduce((a, s) => a + (s.r || 0), 0)
        });
      });
    });
    return out.sort((a, b) => a.week - b.week || (a.date < b.date ? -1 : 1));
  }

  // Most recent performance of `name` before `beforeSessionId` (or latest overall).
  function lastPerf(sessions, name, beforeSessionId) {
    let h = historyFor(sessions, name);
    if (beforeSessionId) {
      const cur = sessions[beforeSessionId];
      if (cur) h = h.filter(x => x.week < cur.week);
    }
    return h.length ? h[h.length - 1] : null;
  }

  // New personal records in `session` versus all other sessions.
  function detectPRs(sessions, sessionId) {
    const cur = sessions[sessionId];
    if (!cur) return [];
    const prs = [];
    const others = {};
    Object.values(sessions).forEach(s => { if (s.id !== sessionId) others[s.id] = s; });
    const seen = new Set();
    Object.values(cur.sets || {}).forEach(slot => {
      if (seen.has(slot.name)) return; seen.add(slot.name);
      const kind = slot.kind || 'weight';
      if (kind === 'time') return;
      const mine = topSet(doneSets(slot), kind);
      if (!mine || mine.score <= 0) return;
      const prev = historyFor(others, slot.name);
      if (!prev.length) return; // first time ever = baseline, not a PR
      const prevBest = Math.max.apply(null, prev.map(h => h.top.score));
      if (mine.score > prevBest + 1e-9) prs.push({ name: slot.name, kind, w: mine.w, r: mine.r });
    });
    return prs;
  }

  // Exercises that have not improved in their last `n` appearances vs. everything before (needs n+1 appearances).
  function stalled(sessions, n) {
    n = n || 2;
    const names = new Set();
    Object.values(sessions).forEach(s => Object.values(s.sets || {}).forEach(sl => names.add(sl.name)));
    const out = [];
    names.forEach(name => {
      const h = historyFor(sessions, name);
      if (h.length < n + 1 || h[0].kind === 'time') return;
      const before = h.slice(0, h.length - n), recent = h.slice(-n);
      const bestBefore = Math.max.apply(null, before.map(x => x.top.score));
      const bestRecent = Math.max.apply(null, recent.map(x => x.top.score));
      if (bestRecent <= bestBefore + 1e-9) {
        const last = h[h.length - 1];
        out.push({ name, kind: last.kind, best: before.reduce((a, x) => (x.top.score > a.top.score ? x : a)).top, last: last.top });
      }
    });
    return out;
  }

  function sessionTotals(session) {
    let volume = 0, sets = 0, reps = 0;
    Object.values(session.sets || {}).forEach(slot => doneSets(slot).forEach(s => {
      sets++; reps += s.r || 0; volume += (s.w || 0) * (s.r || 0);
    }));
    return { volume: Math.round(volume * 100) / 100, sets, reps };

  /* ---------- progress view ---------- */
  function lineChart(pts, unit, target) {
    if (pts.length < 1) return '<div class="muted small">لا توجد بيانات بعد.</div>';
    const W = 320, H = 150, pl = 38, pr = 12, pt = 14, pb = 26;
    const ys = pts.map(p => p.y).concat(target ? [target] : []), lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys), span = hi - lo || 1;
    const x = i => (pts.length === 1 ? (W + pl - pr) / 2 : pl + (W - pl - pr) * i / (pts.length - 1)), y = v => pt + (H - pt - pb) * (1 - (v - lo) / span);
    let d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.y).toFixed(1)).join(' ');
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="الرسم البياني">';
    [lo, (lo + hi) / 2, hi].forEach(v => { s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" style="stroke:var(--line)"/><text x="' + (pl - 6) + '" y="' + (y(v) + 4) + '" font-size="10" style="fill:var(--muted)" text-anchor="end">' + num(v) + '</text>'; });
    if (target) s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(target) + '" y2="' + y(target) + '" stroke="#16A34A" stroke-width="2" stroke-dasharray="6 4"/><text x="' + (W - pr) + '" y="' + (y(target) - 5) + '" font-size="10" fill="#16A34A" text-anchor="end">الهدف ' + num(target) + '</text>';
    s += '<path d="' + d + '" fill="none" stroke="#1F6FEB" stroke-width="3" stroke-linejoin="round"/>';
    pts.forEach((p, i) => { s += '<circle cx="' + x(i) + '" cy="' + y(p.y) + '" r="4.5" style="fill:var(--surface)" stroke="#1F6FEB" stroke-width="2.5"/><text x="' + x(i) + '" y="' + (H - 8) + '" font-size="10" style="fill:var(--muted)" text-anchor="middle">' + p.x + '</text>'; });
    return s + '</svg>';
  }
  function barChart(pts) {
    if (!pts.length) return '<div class="muted small">لا توجد بيانات بعد.</div>';
    const W = 320, H = 130, max = Math.max.apply(null, pts.map(p => p.y)) || 1, bw = Math.min(34, (W - 20) / pts.length - 6);
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="الحجم الأسبوعي">';
    pts.forEach((p, i) => {
      const h = Math.max(2, (H - 36) * p.y / max), x = 10 + i * ((W - 20) / pts.length) + 3;
      s += '<rect x="' + x + '" y="' + (H - 22 - h) + '" width="' + bw + '" height="' + h + '" rx="6" fill="#1F6FEB" opacity=".9"/><text x="' + (x + bw / 2) + '" y="' + (H - 7) + '" font-size="10" style="fill:var(--muted)" text-anchor="middle">' + p.x + '</text><text x="' + (x + bw / 2) + '" y="' + (H - 26 - h) + '" font-size="9" style="fill:var(--ink)" text-anchor="middle">' + Math.round(p.y) + '</text>';
    });
    return s + '</svg>';
  }

  /* ---------- render ---------- */
  function renderView() { return UI.tab === 'home' ? viewHome() : UI.tab === 'workout' ? viewWorkout() : UI.tab === 'progress' ? viewProgress() : UI.tab === 'rec' ? viewRecovery() : UI.tab === 'nutri' ? viewNutrition() : viewSettings(); }
  function render(keepScroll) {
    applyTheme();
    const y = window.scrollY;
    let v; try { v = renderView(); } catch (err) { console.error(err); v = '<div class="card pink"><h2>حدث خطأ في العرض</h2><p class="small" style="direction:ltr;text-align:left">' + esc(String(err && err.message)) + '</p><button class="btn block" data-act="tab" data-tab="home">الرجوع للرئيسية</button></div>'; }
    const nav = [['home', 'الرئيسية', ICON.home], ['workout', 'التمرين', ICON.dumb], ['nutri', 'التغذية', ICON.food], ['progress', 'التقدم', ICON.chart], ['settings', 'الإعدادات', ICON.gear]]
      .map(n => '<button class="' + (UI.tab === n[0] || (UI.tab === 'rec' && n[0] === 'home') ? 'on' : '') + '" data-act="tab" data-tab="' + n[0] + '">' + n[2] + n[1] + '</button>').join('');
    let ov = '';
    if (UI.overlay) { const o = UI.overlay; ov = o.type === 'video' ? overlayVideo(o.id) : o.type === 'swap' ? overlaySwap(o.key) : o.type === 'plates' ? overlayPlates() : o.type === 'recap' ? overlayRecap() : o.type === 'checkin' ? overlayCheckin() : o.type === 'warm' ? overlayWarm() : o.type === 'weigh' ? overlayWeigh() : o.type === 'cardio' ? overlayCardio() : o.type === 'text' ? overlayText(o.title, o.text) : ''; }
    app.innerHTML = v + '<div id="rest"></div><nav class="bar"><div class="in">' + nav + '</div></nav>' + ov;
    document.body.style.overflow = UI.overlay && UI.overlay.type === 'recap' ? 'hidden' : '';
    if (keepScroll) window.scrollTo(0, y);
    drawRest(); tickElapsed(); syncWake();
  }
  let wakeLock = null;
  async function syncWake() {
    const want = UI.tab === 'workout' && !document.hidden;
    try {
      if (want && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
      else if (!want && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
    } catch (err) { wakeLock = null; }
  }
  function tickElapsed() {
    const cr = document.getElementById('cdRun'); if (cr && UI.cardio && UI.cardio.t0) cr.textContent = Math.max(1, Math.round((Date.now() - UI.cardio.t0) / 60000));
    const el = document.getElementById('elapsed'); if (!el || UI.tab !== 'workout') return;
    const se = S.sessions[sessionId(UI.viewWeek || currentWeek(), UI.wk)];
    const sec = se ? (se.done && !se.startedAt ? se.durationSec : se.startedAt ? Math.floor((Date.now() - se.startedAt) / 1000) : 0) : 0;
    el.textContent = '⏱ '+ String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
  }
  setInterval(tickElapsed, 1000);

  /* ---------- file helpers ---------- */
  async function saveFile(name, mime, text, title) {
    try {
      if (typeof claude !== 'undefined' && claude.use) {
        const d = await claude.use('downloads');
        if (d) { await d.save({ filename: name, data: text }); return true; }
      }
    } catch (e) { /* fall through */ }
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: mime })); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      return true;
    } catch (e) { /* fall through */ }
    UI.overlay = { type: 'text', title: title || name, text }; render(true); return false;
  }
  function exportJSON() { return JSON.stringify({ app: 'tamreeni', v: 1, exportedAt: new Date().toISOString(), settings: S.settings, sessions: S.sessions }); }
  function importJSON(text) {
    const o = JSON.parse(text);
    if (!o || o.app !== 'tamreeni' || typeof o.sessions !== 'object') throw new Error('ملف غير صالح');
    S.settings = normalizeSettings(Object.assign({}, S.settings, o.settings || {}));
    Object.values(o.sessions).forEach(s => { if (s && s.id && s.sets) S.sessions[s.id] = s; });
    Store.pushAll();
  }

  /* ---------- events ---------- */

  }
  function onClick(e) {
    const t = e.target.closest('[data-act]'); if (!t) return;
    if (t.classList.contains('overlay') && e.target.closest('[data-stop]')) return;
    const a = t.dataset.act, week = UI.viewWeek || currentWeek();
    switch (a) {
      case 'tab': UI.tab = t.dataset.tab; if (UI.tab === 'workout' && !UI.wk) { UI.wk = WK_LIST.find(k => !(S.sessions[sessionId(week, k)] || {}).done) || 'A'; } UI.overlay = null; render(); window.scrollTo(0, 0); break;
      case 'set-start': { const v = document.getElementById('startDate').value; if (!v) return; S.settings.start = v; Store.saveSettings(); render(); break; }
      case 'save-start': { const v = document.getElementById('startEdit').value; if (!v) return; S.settings.start = v; Store.saveSettings(); toast('تم الحفظ'); break; }

      case 'theme-cycle': { const cur = document.documentElement.dataset.theme; setTheme(cur === 'dark' ? 'light' : 'dark'); render(true); toast(cur === 'dark' ? 'وضع النهار' : 'وضع الليل'); break; }
      case 'set-theme': setTheme(t.dataset.m); render(true); break;
      case 'rest-now': { const se = getSession(week, UI.wk), sl = se.sets[t.dataset.key]; startRest(restFor(se.wk, t.dataset.key.split('.')[1], sl.name) || 60, 'راحة'); break; }
      case 'rest-adj': {
        const se = getSession(week, UI.wk), sl = se.sets[t.dataset.key], cur = restFor(se.wk, t.dataset.key.split('.')[1], sl.name);
        S.settings.restBy = S.settings.restBy || {}; S.settings.restBy[sl.name] = Math.max(0, Math.min(600, cur + (+t.dataset.d))); Store.saveSettings(); render(true); break;

      case 'n-add': {

      case 'n-fav-del': S.settings.favMeals.splice(+t.dataset.i, 1); Store.saveSettings(); render(true); break;
      case 'n-copy-prev': { const date = UI.nDate || L.todayISO(), prev = (S.settings.meals[L.addDays(date, -1)] || []).map(m => ({ name: m.name, kcal: m.kcal, p: m.p })); if (prev.length) { S.settings.meals[date] = prev; Store.saveSettings(); render(true); toast('تم نسخ وجبات أمس'); } break; }
      case 'n-del': { const date = UI.nDate || L.todayISO(); (S.settings.meals[date] || []).splice(+t.dataset.i, 1); Store.saveSettings(); render(true); break; }
      case 'timer': startRest(+t.dataset.sec || 30, t.dataset.label || 'مؤقت'); break;
      case 'toggle-open': UI.open = UI.open || {}; UI.open[t.dataset.oid] = !UI.open[t.dataset.oid]; render(true); break;
      case 'tick': {
        if (t.dataset.kind === 'warm') { const se = getSession(week, UI.wk); se.warm = se.warm || {}; se.warm[t.dataset.id] = !se.warm[t.dataset.id]; Store.saveSession(se.id); }
        else { const d = S.settings.daily[recDate()] = S.settings.daily[recDate()] || {}; UI.recChecks = UI.recChecks || {}; UI.recChecks[t.dataset.id] = !UI.recChecks[t.dataset.id]; }
        render(true); break;
      }
      case 'open-recovery': UI.tab = 'rec'; UI.overlay = null; render(); window.scrollTo(0, 0); break;
      case 'rec-seg': UI.recSeg = t.dataset.seg; render(true); break;
      case 'rec-done': {
        const key = UI.recSeg === 'p' ? 'p' : 's', d = S.settings.daily[recDate()] = S.settings.daily[recDate()] || {};
        d[key] = !d[key]; Store.saveSettings(); toast(d[key] ? 'تم تسجيل الجلسة ✓' : 'تم إلغاء التسجيل'); render(true); break;
      }
      case 'warm-start': { const se = getSession(week, UI.wk), items = warmItems(); se.warm = se.warm || {}; const f = items.findIndex(x => !se.warm[x.id]); UI.warmStep = f < 0 ? 0 : f; UI.overlay = { type: 'warm' }; render(true); break; }
      case 'warm-go': UI.warmStep = Math.max(0, Math.min(warmItems().length - 1, (UI.warmStep || 0) + (+t.dataset.d))); render(true); break;
      case 'warm-next': {
        const se = getSession(week, UI.wk), items = warmItems(), it = items[UI.warmStep || 0]; se.warm = se.warm || {}; se.warm[it.id] = true; Store.saveSession(se.id);
        if ((UI.warmStep || 0) >= items.length - 1) { UI.overlay = null; stopRest(); toast('انتهى الإحماء، ابدأ تمرينك 💪'); } else UI.warmStep++;
        render(true); break;
      }
      case 'weigh-open': UI.overlay = { type: 'weigh' }; render(true); break;
      case 'weigh-save': {
        const v = L.parseNum(document.getElementById('wiIn').value); if (!v) { toast('أدخل وزناً صحيحاً'); return; }
        const bw = S.settings.bodyweights, td = L.todayISO(), ex = bw.find(b => b.date === td); if (ex) ex.kg = v; else bw.push({ date: td, kg: v });
        Store.saveSettings(); UI.overlay = null; toast('تم حفظ الوزن'); render(true); break;
      }
      case 'water-add': { const d = dayLog(L.todayISO()); d.water = Math.max(0, (d.water || 0) + (+t.dataset.ml)); Store.saveSettings(); render(true); break; }
      case 'steps-add': { const dl = dayLog(L.todayISO()), n = t.dataset.n === 'goal' ? S.settings.goals.steps : (dl.steps || 0) + (+t.dataset.n); dl.steps = Math.max(dl.steps || 0, n); Store.saveSettings(); render(true); break; }
      case 'steps-save': { const v = Math.round(L.parseNum(document.getElementById('stepsIn').value)); if (!(v >= 0)) { toast('أدخل رقماً صحيحاً'); return; } dayLog(L.todayISO()).steps = v; Store.saveSettings(); toast('تم حفظ الخطوات'); render(true); break; }
      case 'tgt-save': { const v = L.parseNum(document.getElementById('tgtW').value); S.settings.targetW = v > 0 ? v : 0; Store.saveSettings(); toast('تم حفظ الهدف'); render(true); break; }
      case 'sleep-q': { const q = +t.dataset.q, dl = dayLog(L.todayISO()); dl.sleepQ = dl.sleepQ === q ? 0 : q; Store.saveSettings(); render(true); break; }
      case 'sleep-save': { const v = L.parseNum(document.getElementById('sleepIn').value); if (!(v > 0 && v <= 16)) { toast('أدخل ساعات صحيحة'); return; } dayLog(L.todayISO()).sleep = v; Store.saveSettings(); toast('تم حفظ النوم'); render(true); break; }
      case 'cardio-open': UI.cardio = UI.cardio || { kind: 'bike', t0: null }; UI.overlay = { type: 'cardio' }; render(true); break;
      case 'cardio-kind': UI.cardio.kind = t.dataset.k; render(true); break;
      case 'cardio-timer': { const c = UI.cardio; if (c.t0) { c.min = Math.max(1, Math.round((Date.now() - c.t0) / 60000)); c.t0 = null; } else c.t0 = Date.now(); render(true); break; }
      case 'cardio-save': { const m = Math.round(L.parseNum(document.getElementById('cdMin').value)), hr = Math.round(L.parseNum(document.getElementById('cdHr').value)); if (!(m > 0)) { toast('أدخل مدة صحيحة'); return; } const d = dayLog(L.todayISO()); d.cardio = (d.cardio || []).concat([{ kind: UI.cardio.kind, min: m, hr: hr > 0 ? hr : null }]); UI.cardio = { kind: UI.cardio.kind, t0: null }; UI.overlay = null; Store.saveSettings(); toast('تم حفظ الكارديو'); render(true); break; }
      case 'cardio-del': { const d = dayLog(L.todayISO()); (d.cardio || []).splice(+t.dataset.i, 1); Store.saveSettings(); render(true); break; }
      case 'goal-set': { const g = S.settings.goals, k = t.dataset.k; g[k] = Math.max(k === 'cardio' ? 10 : 250, g[k] + (+t.dataset.d)); Store.saveSettings(); render(true); break; }
      case 'range': UI.range = +t.dataset.r; render(true); break;
      case 'start-now': { const el = document.querySelector('.ss-title'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
      case 'warm-toggle': UI.warmOpen = !UI.warmOpen; render(true); break;
      case 'effort': {
        const se = getSession(week, UI.wk), sl = se.sets[t.dataset.key], s = sl.sets[+t.dataset.i], order = [null, 7, 8, 9, 10, 11];
        s.e = order[(order.indexOf(s.e) + 1) % order.length]; Store.saveSession(se.id); t.textContent = s.e ? EFFORT[s.e] : '—'; t.classList.toggle('on', !!s.e); break;
      }
      case 'check': {
        const se = getSession(week, UI.wk), sl = se.sets[t.dataset.key], i = +t.dataset.i, s = sl.sets[i], last = L.lastPerf(S.sessions, sl.name, se.id);
        if (!s.done) {
          const lw = last && (last.sets[i] || last.sets[last.sets.length - 1]);
          if (s.w == null && sl.kind === 'weight') s.w = lw ? lw.w : null;
          if (sl.kind === 'wopt' && s.w == null) s.w = lw && lw.w ? lw.w : 0;
          if (s.r == null) s.r = lw && lw.r ? lw.r : (sl.kind === 'time' ? 30 : null);
          if ((sl.kind === 'weight' && s.w == null) || s.r == null) { toast(sl.kind === 'weight' ? 'أدخل الوزن والتكرارات' : 'أدخل التكرارات'); return; }
          if (sl.kind === 'bw') s.w = 0;
          s.done = true; if (!se.startedAt && !se.done) se.startedAt = Date.now();
          if (!se.date || !se.startedAt) se.date = se.date || L.todayISO();
          const pr = slotProgress(se); Store.saveSession(se.id);
          const rs = restFor(se.wk, t.dataset.key.split('.')[1], sl.name);
          if (pr.d < pr.t && rs > 0) startRest(rs, se.wk === 'AB' ? 'راحة بين الجولات' : 'راحة بين التمارين'); else stopRest();
          beep(1);
        } else { s.done = false; Store.saveSession(se.id); }
        render(true); break;
      }
      case 'hold': startRest(+t.dataset.sec || 30, 'ثبات — ابقَ في الوضعية'); break;
      case 'rest-add': if (rest) { rest.end += (+t.dataset.v) * 1000; rest.total = Math.max(rest.total, Math.ceil((rest.end - Date.now()) / 1000)); tickRest(); } break;
      case 'rest-stop': stopRest(); break;
      case 'swap': UI.sessionForOverlay = getSession(week, UI.wk); UI.overlay = { type: 'swap', key: t.dataset.key }; render(true); break;
      case 'pick-swap': {
        const key = t.dataset.key, [wk, exId] = key.split('.'), se = getSession(week, wk), sl = se.sets[key];
        if (sl.sets.some(x => x.done)) { toast('لا يمكن التبديل بعد تسجيل مجموعات'); UI.overlay = null; render(true); return; }
        const altId = t.dataset.alt || null; if (altId) S.settings.swaps[key] = altId; else delete S.settings.swaps[key];
        const c = choice(wk, exId); Object.assign(sl, c, { sets: blankSets(exDef(wk, exId).sets), note: '' });
        Store.saveSettings(); Store.saveSession(se.id); UI.overlay = null; render(true); break;
      }
      case 'plates': {
        const sl = t.dataset.key && getSession(week, UI.wk).sets[t.dataset.key];
        if (sl) { const lp = L.lastPerf(S.sessions, sl.name, sessionId(week, UI.wk)), cur = sl.sets.map(s => s.w).filter(w => w > 0).pop(), w = cur || (lp && lp.top && lp.top.w) || ''; UI.plateCalc = { mode: /dumbbell|goblet/i.test(sl.name) ? 'db' : 'bar', total: w ? String(w) : '' }; }
        else UI.plateCalc = UI.plateCalc || { mode: 'bar', total: '' };
        UI.overlay = { type: 'plates' }; render(true); break;
      }
      case 'pc-mode': UI.plateCalc.mode = t.dataset.m; render(true); break;
      case 'vid': // YouTube refuses embeds without a real https origin (error 153): local files and embedded previews (artifact frames) open the video in YouTube instead
        if (location.protocol !== 'https:' && location.protocol !== 'http:' || location.origin === 'null' || window.top !== window.self) { window.open('https://youtu.be/' + t.dataset.v, '_blank', 'noopener'); break; }
        UI.overlay = { type: 'video', id: t.dataset.v }; render(true); break;
      case 'deload-on': S.settings.deloadWeek = UI.viewWeek || currentWeek(); Store.saveSettings(); render(true); break;
      case 'deload-off': S.settings.deloadWeek = 0; Store.saveSettings(); render(true); break;
      case 'close-overlay': UI.overlay = null; render(true); break;
      case 'finish': {
        const se = getSession(week, UI.wk), pr = slotProgress(se);
        if (pr.d < pr.t && !t.dataset.confirm) { t.dataset.confirm = 1; t.textContent = 'تبقّت ' + (pr.t - pr.d) + ' مجموعات — اضغط للإنهاء على أي حال'; return; }
        finishWorkout(); break;
      }
      case 'recap-next': {
        const wasAB = UI.recap && S.sessions[UI.recap.id] && S.sessions[UI.recap.id].wk === 'AB';
        const done = Object.values(S.sessions).filter(s => s.done && s.wk !== 'AB').length;
        UI.overlay = done > 0 && done % 3 === 0 && !wasAB ? { type: 'checkin' } : null; UI.tab = wasAB ? 'home' : 'rec'; UI.recSeg = 's'; UI.wk = null; render(); window.scrollTo(0, 0); break;
      }
      case 'plate': { const k = t.dataset.k; S.settings.plates[k] = Math.max(0, (S.settings.plates[k] || 0) + (+t.dataset.d)); Store.saveSettings(); render(true); break; }
      case 'rest-set': S.settings.restSec = Math.max(15, Math.min(300, S.settings.restSec + (+t.dataset.d))); Store.saveSettings(); render(true); break;
      case 'meas-save': {
        const rec = { date: L.todayISO() }; let any = false;
        MEAS.forEach(m => { const v = L.parseNum(document.getElementById('ms_' + m[0]).value); if (v > 0) { rec[m[0]] = v; any = true; } });
        if (!any) { toast('أدخل قياساً واحداً على الأقل'); return; }
        const ms = S.settings.measures, ex = ms.find(x => x.date === rec.date), prev = ms[ms.length - 1] || {};
        MEAS.forEach(m => { if (!rec[m[0]] && prev[m[0]]) rec[m[0]] = prev[m[0]]; }); // keep last value for blanks
        if (ex) Object.assign(ex, rec); else ms.push(rec);
        Store.saveSettings(); toast('تم حفظ القياسات'); render(true); break;
      }
      case 'bw-add': { const v = L.parseNum(document.getElementById('bwIn').value); if (!v) { toast('أدخل وزناً صحيحاً'); return; } const bwl = S.settings.bodyweights, td = L.todayISO(), ex = bwl.find(b => b.date === td); if (ex) ex.kg = v; else bwl.push({ date: td, kg: v }); Store.saveSettings(); toast('تم حفظ الوزن'); render(true); break; }
      case 'export-json': saveFile('tamreeni-backup-' + L.todayISO() + '.json', 'application/json', exportJSON(), 'نسخة احتياطية').then(() => { S.settings.lastBackup = Date.now(); Store.saveSettings(); toast('تم تجهيز النسخة الاحتياطية'); }); break;
      case 'export-csv': saveFile('tamreeni-' + L.todayISO() + '.csv', 'text/csv', L.csvRows(S.sessions), 'تصدير CSV'); break;
      case 'copy-text': { const ta = document.getElementById('outText'); ta.select(); try { navigator.clipboard.writeText(ta.value); toast('تم النسخ'); } catch (e) { document.execCommand && document.execCommand('copy'); toast('تم النسخ'); } break; }
      case 'reset-all':
        if (!t.dataset.confirm) { t.dataset.confirm = 1; t.textContent = 'اضغط مرة أخرى لتأكيد حذف كل شيء'; return; }
        S.sessions = {}; S.settings = defaultSettings(); Store.writeLocal();
        if (Store.coll) { Store.coll.get().then(sn => sn.docs.forEach(d => d.ref ? d.ref.delete() : Store.coll.doc(d.id).delete())).catch(() => {}); }
        UI.tab = 'home'; render(); break;
    }
  }
  function onChange(e) {
    const t = e.target;
    if (t.dataset.f) {
      const week = UI.viewWeek || currentWeek(), se = getSession(week, UI.wk), s = se.sets[t.dataset.key].sets[+t.dataset.i], v = L.parseNum(t.value);
      if (t.value.trim() && v === null) { toast('أدخل رقماً صحيحاً'); t.value = ''; return; }
      s[t.dataset.f] = v; Store.saveSession(se.id);
    } else if (t.dataset.actNote) {
      const week = UI.viewWeek || currentWeek(), se = getSession(week, UI.wk); se.sets[t.dataset.actNote].note = t.value.trim().slice(0, 300); Store.saveSession(se.id);
    } else if (t.dataset.actEx) { UI.exStat = t.value; render(true); }
    else if (t.dataset.sched) { S.settings.schedule[t.dataset.sched] = +t.value; Store.saveSettings(); }
    else if (t.id === 'barKg' || t.id === 'dbKg') { const v = L.parseNum(t.value); if (v == null) { toast('أدخل رقماً'); t.value = S.settings[t.id]; return; } S.settings[t.id] = v; Store.saveSettings(); }
    else if (t.dataset.import !== undefined) {
      const f = t.files && t.files[0]; if (!f) return;
      f.text().then(txt => { importJSON(txt); toast('تم الاستيراد'); render(); }).catch(() => toast('ملف غير صالح'));
    }
  }
  function onInput(e) {
    const t = e.target;
    if (t.id === 'warmW2') { UI.warmW2 = t.value; document.getElementById('warmOut2').innerHTML = warmOut(t.value); }
    if (t.id === 'warmW') { UI.warmW = t.value; document.getElementById('warmOut').innerHTML = warmOut(t.value); }
    else if (t.id === 'pcTotal') { UI.plateCalc.total = t.value; const d = document.createElement('div'); d.innerHTML = overlayPlates(); document.getElementById('pcOut').innerHTML = d.querySelector('#pcOut').innerHTML; }
  }
  app.addEventListener('click', onClick);
  app.addEventListener('change', onChange);
  app.addEventListener('input', onInput);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && rest) tickRest(); syncWake(); });

  /* ---------- boot ---------- */
  app.innerHTML = '<div style="padding:60px 0;text-align:center" class="muted">جارٍ التحميل…</div>';
  Store.init().then(() => { render(); }).catch(() => { render(); });
})();

</script>
